# @package _global_
# GOAT-Bench task configuration for UniGoal
# Uses same HM3D scenes as instance_imagenav but with GOAT episode format.
# Episodes are parsed directly from JSON (no GoatTask plugin required).

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: instance_imagenav
  # val_unseen installation contains RGB-D geometry/navmeshes but no semantic
  # meshes; open-vocabulary semantics are produced by GroundingDINO/SAM.
  - /habitat/simulator/agents@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/instance_imagenav: hm3d_v3
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    max_episode_seconds: 10000000
  task:
    end_on_success: False
    measurements:
      success:
        success_distance: 1.0
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
            position: [0, 0.88, 0]
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
            position: [0, 0.88, 0]
        height: 0.88
        radius: 0.18
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: True
  dataset:
    # Used only to load scene geometry; episode data is loaded by GoatEpisodeParser
    split: val
