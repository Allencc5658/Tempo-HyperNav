seed: 1
num_processes: 1
num_eval_episodes: 360
cuda: true
sim_gpu_id: 0
log_interval: 10
dump_location: "./outputs/experiments/goat_unigoal/"
experiment_id: "val_unseen_h088"
# Save per-episode mp4 videos under visualization/videos.
# For full 360-episode benchmark runs this is slower and uses much more disk,
# but it is essential for debugging the GOAT adapter.
visualize: 1
environment: "habitat"

# Directly comparable with the existing UniGoal experiments.
env_frame_width: 640
env_frame_height: 480
frame_width: 160
frame_height: 120
camera_height: 0.88
agent_height: 0.88
agent_radius: 0.18
camera_tilt_deg: 0.0
hfov: 79
turn_angle: 15
forward_step_size: 0.25
allow_sliding: true
# MSGNav-style GOAT metric: final viewpoint geodesic distance < 0.25 m.
success_dist: 0.25
subtask_budget_mode: "goat_discrete_actions"
max_subtask_actions: 500
max_episode_steps: 5000
min_stop_step: 0
arrival_reject_frontier_enabled: true
arrival_reject_frontier_penalty: 3.0
arrival_reject_frontier_radius_m: 2.0
execution_model: "unigoal_discrete"
goat_metric_mode: "msgnav_geodesic"

task_config: "tasks/goat_hm3d.yaml"
goat_split: "val_unseen"
goat_dataset_path: "data/datasets/goat_bench/hm3d/v1/{split}/{split}.json.gz"
goat_scene_data_path: "data/scene_datasets/hm3d_v0.2/val"
split: "val"

min_depth: 0.0
max_depth: 10.0

num_local_steps: 40
sem_pred_prob_thr: 0.50
global_downscaling: 3
vision_range: 100
du_scale: 1
cat_pred_threshold: 5.0
map_pred_threshold: 1.0
exp_pred_threshold: 1.0
collision_threshold: 0.20

num_sem_categories: 16
map_size_cm: 3600
map_resolution: 5

llm_model: "llama2:7b"
vlm_model: "llava:7b"
api_key: "ollama"
base_url: "http://localhost:11434/v1/"
